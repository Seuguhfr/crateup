<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' tauri: https://tauri.localhost ipc:; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: asset: tauri: https://tauri.localhost; media-src 'self' asset: tauri: https://tauri.localhost blob:; connect-src 'self' asset: tauri: https://tauri.localhost ipc: ws: http://localhost:*;" />
  <title>CrateUp</title>
  <link rel="stylesheet" href="./styles/tokens.css" />
  <link rel="stylesheet" href="./styles/app.css" />
  <script src="./wavesurfer.js"></script>
</head>
<body>
  <div id="app">
    <header class="tb" data-tauri-drag-region>
      <div class="tit" data-tauri-drag-region>
        <span class="crumb" id="crumb" data-tauri-drag-region>CrateUp</span>
      </div>
      <div class="spacer" id="tb-drag" data-tauri-drag-region></div>
      <div class="stage-wrap hidden" id="stage-wrap" data-tauri-drag-region>
        <div class="stage-track hidden" id="stage-strip" data-tauri-drag-region aria-label="Job stage"></div>
      </div>
      <div class="right">
        <span class="ses" id="session-status" data-tauri-drag-region title="Active session">No active session</span>
        <div class="seg">
          <button id="theme-light">Light</button>
          <button id="theme-dark" class="on">Dark</button>
        </div>
      </div>
    </header>

    <div class="app">
      <aside class="sidebar">
        <div class="sb">
          <div class="nvg">Tools</div>
          <nav id="nav" aria-label="Tools">
            <a class="nv" href="#/home" data-route="home">
              <span class="ic"><svg viewBox="0 0 16 16"><path d="M8 2l6 4.5v7.5h-4v-5H6v5H2V6.5z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></span>
              <span>Home</span>
            </a>
            <!-- tool entries rendered by renderToolNav (ui/src/main.ts) -->
          </nav>
          <div class="nvg" id="sources-head">Sessions</div>
          <div id="sources-list"><div class="nv"><span class="ic"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M8 4.5V8l2.5 1.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" fill="none"/></svg></span><span>No active session</span></div></div>
        </div>
        <div class="sbfoot">
          <a class="nv" href="#/settings" data-route="settings">
            <span class="ic"><svg viewBox="0 0 16 16"><path d="M2 5.5h12M2 10.5h12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="6" cy="5.5" r="2" fill="currentColor"/><circle cx="10.5" cy="10.5" r="2" fill="currentColor"/></svg></span>
            <span>Settings</span>
          </a>
          <div class="meta">
            <span id="bridge-dot" class="dot" title="Tauri bridge status"></span>
            <span id="bridge-label">Connecting…</span>
          </div>
        </div>
      </aside>

      <section class="content">
        <main id="view"></main>
        <footer id="dock" class="dock hidden">
          <span id="dock-note" class="dock-label"></span>
          <div id="dock-actions" class="dock-actions"></div>
        </footer>
      </section>

      <aside class="insp">
        <div id="insp-body" class="isc">
          <div class="empty">Welcome.<br /><span class="sub">Context opens here while you work.</span></div>
        </div>
        <div id="insp-foot" class="isf hidden"></div>
      </aside>
    </div>
  </div>
  <script type="module" src="./out/main.js"></script>
</body>
</html>
